name: Capstone CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint Django and Flask
        run: ruff check --isolated --select E4,E7,E9,F,I server/djangoapp server/djangoproj
  javascript-lint:
    name: JavaScript lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint on the frontend entry points
        run: npx --no-install eslint src/App.js src/api.js src/index.js src/components/Register/Register.jsx --max-warnings 0
      - name: Check Express JavaScript syntax
        run: node --check ../database/app.js
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application containers
        run: docker compose build
      - name: Start application
        run: docker compose up -d
      - name: Verify Django, MongoDB API and sentiment
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8080/
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8080/djangoapp/get_dealers/Kansas
          curl --fail http://localhost:8080/djangoapp/get_cars
          docker compose exec -T web python -c "import requests; assert requests.get('http://sentiment:5050/analyze', params={'text': 'Wonderful service!'}, timeout=5).json() == {'sentiment': 'positive'}"
      - name: Show service logs
        if: failure()
        run: docker compose logs
